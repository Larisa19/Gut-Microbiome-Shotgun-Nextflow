# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare reports
        run: |
          mkdir -p _site/raw
          mkdir -p _site/trimmed
          cp results/multiqc/multiqc_report.html _site/raw/multiqc_report.html
          cp results/multiqc_trimmed/multiqc_report.html _site/trimmed/multiqc_report.html

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gut Microbiome Shotgun Metagenomics</title>
          </head>
          <body>
            <h1>Gut Microbiome Shotgun Metagenomics</h1>
            <h2>Quality Control Reports</h2>

            <ul>
              <li>
                <a href="raw/multiqc_report.html">Raw-read QC — MultiQC</a>
              </li>
              <li>
                <a href="trimmed/multiqc_report.html">Post-trimming QC — MultiQC</a>
              </li>
            </ul>
          </body>
          </html>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
